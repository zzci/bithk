[global]
app       = "bit"
data_dir  = "/srv/lode"
log_level = "info"

[update]
github         = "zzci/bithk"
asset          = "bit-linux-x64.tar.gz"
channel        = "stable"
policy         = "check"
check_interval = 300
keep_versions  = 3

[trust]
require_signature = "auto"

[command]
run     = "bun run index.js"
exec    = "bun"

[runtime]
runtime  = "bun"
download = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
version  = "1.3.14"

[env]
NODE_ENV = "production"
DATA_DIR = "/srv/lode/data"
APP_NAME = "bit"
APP_DISPLAY_NAME = "BIT.YT"
CORS_ORIGIN = "https://oa.bit.yt"
APP_URL = "https://oa.bit.yt"
OAUTH_ISSUER = "https://login.gid.io/oidc"
OAUTH_CLIENT_ID = "68yxzpc6z7u89jh058dqp"
OAUTH_PKCE = "true"
DEFAULT_ADMIN = "a@roy.me"
