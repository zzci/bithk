[global]
app = "bit"
data_dir = "/srv/lode"
log_level = "info"

[update]
# GitHub Releases source. For a non-GitHub source, replace this with:
# manifest = "https://releases.example.com/bit/manifest.json"
github = "zzci/bithk"
asset = "bit-linux-x64.tar.gz"
entry = "index.js"
channel = "stable"
policy = "auto"
check_interval = 300
keep_versions = 3

[command]
# The package contains index.js plus package.json scripts for CLI passthrough.
run = "bun"
exec = "bun run"
workdir = "{dir}"

[supervise]
restart = "off"
readiness = "state"
ready_timeout = 30
health_grace = 20
stop_timeout = 30

[trust]
require_signature = "auto"
# trusted_keys = ["<key_id>:<base64-pubkey>"]
