[global]
app = "bit"
data_dir = "/srv/lode"
log_level = "info"

[update]
# GitHub Releases source. For a non-GitHub source, replace this with:
# manifest = "https://releases.example.com/bit/manifest.json"
github = "zzci/bithk"
asset = "bit-linux-x64.tar.gz"
channel = "stable"
policy = "auto"
check_interval = 300
keep_versions = 3

[command]
# Launch is the full command (whitespace-split; only {dir} expands). The asset
# ships index.js plus package.json scripts, so exec="bun run" maps CLI
# passthrough such as `lode migrate` to `bun run migrate`. The manifest asset
# publishes the same run/exec, which override these.
run = "bun index.js"
exec = "bun run"
workdir = "{dir}"

[supervise]
restart = "off"
readiness = "state"
ready_timeout = 30
# The app opts into the staged-update prepare handshake (reports ready as
# "-0"). Bound the wait for its prepare ack so a stuck app cannot block a
# cut-over indefinitely (default 0 = wait forever).
prepare_timeout = 25
health_grace = 20
stop_timeout = 30

[trust]
require_signature = "auto"
# trusted_keys = ["<key_id>:<base64-pubkey>"]
