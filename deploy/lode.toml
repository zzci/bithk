[global]
app       = "bit"
dir       = "/srv/lode"
log_level = "info"

[update]
github         = "zzci/bithk"
asset          = "bit-linux-x64.tar.gz"
channel        = "stable"
policy         = "check"
check_interval = 300
keep_versions  = 3

[trust]
require_signature = "auto"

[command]
run     = "bun run index.js"
exec    = "bun"

[runtime]
runtime  = "bun"
download = "https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip"
version  = "1.4.0"

[env]
NODE_ENV = "production"
DATA_DIR = "/srv/lode/data"
APP_NAME = "bit"
APP_DISPLAY_NAME = "BIT.YT"
CORS_ORIGIN = "https://oa.bit.yt"
APP_URL = "https://oa.bit.yt"
OAUTH_ISSUER = "https://login.gid.io/oidc"
OAUTH_CLIENT_ID = "68yxzpc6z7u89jh058dqp"
OAUTH_PKCE = "true"
DEFAULT_ADMIN = "a@roy.me"

# Real client IP behind the Cloudflare -> Traefik -> app chain. The app prefers
# Cloudflare's `CF-Connecting-IP` (the true visitor IP) but only when forwarding
# headers are trusted, so BOTH must be set together:
#   TRUST_PROXY=true          honour forwarding headers
#   TRUSTED_PROXY_IPS=<cidr>  the immediate peer (Traefik) range. In production
#                             an EMPTY allow-list makes the app ignore headers
#                             and return the peer IP (fail-closed), so this MUST
#                             be the address Traefik connects from as seen by the
#                             app (e.g. the Docker network range, 172.16.0.0/12).
# TRUST_PROXY = "true"
# TRUSTED_PROXY_IPS = "172.16.0.0/12"
