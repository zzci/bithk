name: release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.14.x"
  APP_NAME: bit

jobs:
  artifact:
    name: build lode artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          platform="linux-x86_64"
          artifact="${APP_NAME}-${version}-${platform}.tar.gz"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${artifact}"
          bun run package -- --app-name "${APP_NAME}" --version "${version}" --platform "${platform}" --artifact-url "${url}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt dist/manifest.json --clobber
