name: release

# Builds and uploads lode assets to an existing GitHub Release.
#
# Release publishing is the source of truth. The workflow is intentionally not
# triggered by tag pushes, which avoids building against a tag/release mismatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and upload assets for, for example v0.1.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.14.x"
  APP_NAME: bit
  ASSET_SUFFIX: linux-x64
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  asset:
    name: build and upload lode release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Resolves TAG_NAME / RELEASE_VERSION / ASSET_NAME / ASSET_URL into
      # $GITHUB_ENV for the steps below.
      - name: Resolve release metadata
        run: bash scripts/ci/release-metadata.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package lode asset
        run: |
          set -euo pipefail
          bun run package -- \
            --app-name "${APP_NAME}" \
            --version "${RELEASE_VERSION}" \
            --asset-name "${ASSET_NAME}" \
            --asset-url "${ASSET_URL}"

      - name: Validate lode release assets
        run: bun scripts/ci/validate-lode-release.ts

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/upload-release.sh
