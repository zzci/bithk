name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same PR; never cancel main pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pin tool versions explicitly so a bun/node minor upgrade is a deliberate
  # PR, not a silent main-branch breakage. Renovate/dependabot can bump.
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22.13.0"

jobs:
  check:
    name: lint + typecheck + test + build + docs-drift
    strategy:
      fail-fast: false
      matrix:
        # Linux-only: the app deploys to Linux (Docker/lode). The macOS leg was
        # dropped in FIX-058 — re-add "macos-latest" here if mac CI is needed again.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Single source of truth — matches `package.json`'s `check` script so a
      # green local run is a green CI run. Bundles lint + typecheck + test +
      # build + check:i18n + check:env-docs + check:api-docs. Output is teed
      # to a file so the coverage gate below can parse the api coverage table
      # (coverage is always-on via apps/api/bunfig.toml) without re-running
      # the suite.
      - name: Check
        run: |
          set -euo pipefail
          bun run check 2>&1 | tee "$RUNNER_TEMP/check-output.txt"

      # Coverage ratchet — enforced here because Bun 1.3.14 does not fail a
      # run on bunfig `coverageThreshold` (it only prints the table). We parse
      # the text reporter's "All files" row (which honours
      # `apps/api/bunfig.toml`'s coveragePathIgnorePatterns) from the Check
      # step's output — `bun run --filter` prefixes each api line with
      # "@app/api test: ", which also disambiguates it from the web (vitest)
      # coverage table. Linux only — the gate is deterministic across OSes,
      # one run is sufficient and keeps the macOS leg fast.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        env:
          MIN_LINE: "80"
          MIN_FUNC: "70"
        run: |
          set -euo pipefail
          # "@app/api test: All files | <func%> | <line%> |"
          row="$(grep -F '@app/api test: All files' "$RUNNER_TEMP/check-output.txt" | tail -1 || true)"
          line="$(printf '%s' "$row" | awk -F'|' '{gsub(/ /,"",$3); print $3}')"
          func="$(printf '%s' "$row" | awk -F'|' '{gsub(/ /,"",$2); print $2}')"
          echo "Measured: lines=${line}% functions=${func}% (floor: lines>=${MIN_LINE}% functions>=${MIN_FUNC}%)"
          awk -v l="$line" -v f="$func" -v ml="$MIN_LINE" -v mf="$MIN_FUNC" 'BEGIN{
            if (l=="" || f=="") { print "::error::could not parse coverage from text reporter"; exit 1 }
            if (l+0 < ml+0) { printf "::error::line coverage %.2f%% below floor %s%%\n", l, ml; exit 1 }
            if (f+0 < mf+0) { printf "::error::function coverage %.2f%% below floor %s%%\n", f, mf; exit 1 }
            print "coverage gate passed"
          }'

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: apps/api/coverage/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # trufflehog walks history for past commits

      - name: trufflehog (secrets)
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          # Scan the working tree (filesystem mode) so the action stays
          # agnostic to PR vs push events; --only-verified caps the
          # noise to credentials trufflehog could actively authenticate
          # with against the originating service.
          extra_args: --results=verified,unknown

      - name: osv-scanner (dependency CVEs)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=bun.lock

  dependency-review:
    name: dependency review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          build-args: BUILD_COMMIT=${{ github.sha }}
          # No layer cache on purpose: the image is a base pull plus one
          # `apt-get upgrade` layer, and restoring that layer from the GHA
          # cache is exactly what left trivy scanning stale Debian packages.
          pull: true
          no-cache: true
          tags: app:ci-${{ github.sha }}

      - name: trivy (built image CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy results
        if: always()
        # Non-blocking until GHAS is enabled: code-scanning SARIF upload needs
        # it on a private repo. Re-tighten once GHAS is enabled. The trivy scan
        # step above still gates the build on HIGH,CRITICAL (exit-code 1).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          sarif_file: trivy-image.sarif

  e2e:
    name: e2e (dex + api)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e suite
        run: bun run test:e2e

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ github.run_id }}
          path: tests/e2e/.cache/reports/
          if-no-files-found: ignore
          retention-days: 14
